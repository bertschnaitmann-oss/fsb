<!DOCTYPE html>
<html lang="de">
<head>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#076cad">
<link rel="stylesheet" href="fonts/fonts.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FSB Team Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f7fa;--card:#fff;--tx:#243744;--mu:#596e7b;--ln:#dbe5ec;--ac:#076cad;--acx:#fff;--todo:#b3392d;--thema:#076cad;--abs:#76509e;--ok:#287747;--heading:#055385}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c26;--card:#192b38;--tx:#eef5fa;--mu:#a6bbc9;--ln:#334b5d;--ac:#83c7f4;--acx:#102c40;--todo:#ffab9f;--thema:#83c7f4;--abs:#d0b2f3;--ok:#76d69a;--heading:#b3dfff}}
:root[data-theme="dark"]{--bg:#101c26;--card:#192b38;--tx:#eef5fa;--mu:#a6bbc9;--ln:#334b5d;--ac:#83c7f4;--acx:#102c40;--todo:#ffab9f;--thema:#83c7f4;--abs:#d0b2f3;--ok:#76d69a;--heading:#b3dfff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}
header{padding:16px 16px 8px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.allbtn{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:13px;margin-top:2px}
.peek{display:block;width:100%;margin-top:8px;padding:2px 0 2px 10px;border:0;border-left:2px solid var(--ln);background:none;color:var(--mu);font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold{align-self:flex-start;border:0;background:none;color:var(--ac);font-size:13px;padding:0}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tab{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tab.col{border-color:var(--c);color:var(--c)}
.tab.col.on{background:var(--c);color:#fff;border-color:var(--c)}
.list{padding:4px 16px;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);background:none;color:var(--acx);padding:0;font-size:15px;line-height:1}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .t{text-decoration:line-through;color:var(--mu)}
.body{flex:1;min-width:0}
.t{word-wrap:break-word;overflow-wrap:anywhere}
.meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mu);align-items:center}
.badge{font-weight:600;border-radius:6px;padding:2px 7px;border:1px solid currentColor}
.b-todo{color:var(--todo)}.b-thema{color:var(--thema)}.b-abs{color:var(--abs)}
.del{flex:none;border:0;background:none;color:var(--mu);font-size:20px;padding:0 4px}
.del.armed{background:#c0392b;color:#fff;border-radius:8px;font-size:13px;padding:6px 8px;white-space:nowrap}
.grip{flex:none;border:0;background:none;color:var(--mu);font-size:20px;line-height:1;padding:2px 0;width:20px;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.item.drag{box-shadow:0 8px 24px rgba(0,0,0,.3);position:relative;z-index:3}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.types{display:flex;gap:6px}
.types .tab{flex:1;text-align:center;padding:8px 4px;font-size:13px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px}
textarea{min-height:90px;resize:vertical}
.go{border:0;background:var(--ac);color:var(--acx);border-radius:10px;padding:14px;font-size:16px;font-weight:600}
.go:disabled{opacity:.5}
.subtoggle{margin-left:auto;border:1px solid var(--ac);background:none;color:var(--ac);font-size:16px;line-height:1;width:24px;height:24px;border-radius:50%;padding:0}
.subtoggle.on{background:var(--ac);color:var(--acx)}
.subs{margin-top:8px;padding-left:10px;border-left:2px solid var(--ln);display:flex;flex-direction:column;gap:8px}
.sub-row{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.schk{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mu);background:none;color:var(--acx);padding:0;font-size:12px;line-height:1;margin-top:2px}
.sub-row.done .schk{background:var(--ok);border-color:var(--ok)}
.sub-row.done .st{text-decoration:line-through;color:var(--mu)}
.st{flex:1;min-width:0;overflow-wrap:anywhere}
.sdel{border:0;background:none;color:var(--mu);font-size:18px;padding:0 2px}
.addrow{display:flex;gap:6px}
.addrow input{padding:9px 10px;font-size:15px}
.addrow button{flex:none;border:0;background:var(--ac);color:var(--acx);border-radius:10px;padding:0 14px;font-size:20px}
.nm{padding:7px 10px;font-size:13px}
.stin{flex:1;min-width:0;width:auto;min-height:0;border:0;background:transparent;padding:2px 4px;border-radius:6px;font:inherit;font-size:15px;line-height:1.35;color:var(--tx);resize:none;overflow:hidden;display:block}
.stin:focus{outline:1px solid var(--ln);background:var(--bg)}
.sub-row.done .stin{text-decoration:line-through;color:var(--mu)}
.sw{flex:none;color:var(--mu);font-size:13px;margin-top:3px}
.newrow .stin{border:1px dashed var(--ln);padding:6px 8px}
.note{margin:16px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--ln);color:var(--mu);font-size:14px}

/* Farben und Typografie der Freien Schule Bergmeilen. */
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
header{padding:28px max(20px,calc((100% - 888px)/2)) 30px;gap:16px;align-items:center;background:linear-gradient(rgba(3,47,79,.24),rgba(3,47,79,.24)),linear-gradient(141deg,#4393c7,#1d81c2 31%,#4393c7);color:#fff;border-bottom:4px solid #076cad}
.brand{min-width:0}
.school-name{font-size:13px;font-weight:600;letter-spacing:.025em;margin:0 0 5px}
h1{font-family:"Fresca",sans-serif;font-size:36px;line-height:1.15;font-weight:400;margin:0 0 8px}
header .sub{color:#fff;font-size:13px}
header .allbtn{background:#fff;color:#055385;border-color:#fff;border-radius:10px;min-height:44px;max-width:150px;white-space:normal;font-weight:600;margin:0}
header .allbtn:focus-visible{outline-color:#fff}
.tabs{max-width:920px;margin:0 auto;padding:18px 16px 14px;gap:8px;scrollbar-width:thin}
.tab{min-height:44px;border-radius:10px;font-weight:600}
.tab.on{box-shadow:0 2px 5px rgba(5,83,133,.12)}
.tab.col.on{background:var(--card);color:var(--c);border-color:var(--c);box-shadow:inset 0 -3px var(--c)}
.list{max-width:920px;margin:0 auto;gap:12px;padding:4px 16px}
.item{padding:18px 14px;border-radius:14px;box-shadow:0 2px 8px rgba(5,53,83,.04);gap:10px}
.t{font-weight:600;line-height:1.55}
.meta{margin-top:10px;gap:8px}
.badge{border-radius:5px;padding:3px 8px;font-size:11px}
.chk{margin-top:1px}
.grip,.del{min-height:30px}
.subtoggle{width:30px;height:30px}
.subs{margin-top:12px;padding-top:4px;padding-left:12px;gap:10px}
.peek{margin-top:12px;min-height:32px}
.fab{right:max(20px,calc((100% - 888px)/2));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;box-shadow:0 5px 18px rgba(5,83,133,.25)}
.sheet{background:rgba(9,31,47,.48);padding-top:24px}
.panel{max-width:600px;margin:0 auto;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;max-height:100%;overflow-y:auto;box-shadow:0 -8px 40px rgba(5,53,83,.12)}
.go{min-height:48px}
.note{max-width:888px;margin:16px auto;padding:20px;border-radius:14px}
.empty{padding:52px 20px;line-height:1.8}
@media(max-width:600px){header{padding:22px 16px 24px;flex-wrap:wrap;gap:14px}h1{font-size:32px}.school-name{font-size:12px}.item{padding:14px 10px;gap:8px}.note{margin:12px 16px}.types{flex-wrap:wrap}.types .tab{min-width:90px}}
</style>
</head>
<body>
<header>
  <div class="brand"><p class="school-name">Freie Schule Bergmeilen</p><h1>Team Board</h1>
  <div class="sub">To-Dos, offene Themen &amp; Absprachen</div></div>
  <button class="allbtn" id="allbtn" style="display:none">Alle ausklappen</button>
</header>
<div class="tabs" id="tabs"></div>
<div id="note"></div>
<div class="list" id="list"></div>
<button class="fab" id="fab" aria-label="Neuer Eintrag">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="types" id="types"></div>
    <textarea id="txt" placeholder="Was soll festgehalten werden?"></textarea>
    <input id="who" placeholder="Wer? (optional)" maxlength="40">
    <button class="go" id="save" disabled>Hinzufügen</button>
  </div>
</div>

<script>
window.addEventListener("error",function(e){var d=document.createElement("div");d.style.cssText="background:#c0392b;color:#fff;padding:10px 14px;font:14px system-ui;position:fixed;top:0;left:0;right:0;z-index:99";d.textContent="Fehler: "+(e.message||"unbekannt");document.body.appendChild(d)});
window.addEventListener("unhandledrejection",function(e){var d=document.createElement("div");d.style.cssText="background:#c0392b;color:#fff;padding:10px 14px;font:14px system-ui;position:fixed;top:0;left:0;right:0;z-index:99";d.textContent="Fehler: "+((e.reason&&e.reason.message)||e.reason);document.body.appendChild(d)});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const TYPES={todo:"To-Do",thema:"Offenes Thema",abs:"Absprache"};
const isDone=i=>i.type==="todo"&&!!i.done;
const cmp=(a,b)=>{const x=isDone(a),y=isDone(b);if(x!==y)return x-y;if(x)return (b.doneAt||0)-(a.doneAt||0);return ordOf(a)-ordOf(b)};
const ordOf=i=>typeof i.ord==="number"?i.ord:-(i.ts||0);
let dragging=false;
let open=new Set(),drafts={},myName="";
try{myName=localStorage.getItem("tb_name")||""}catch(e){}
let items=[],filter="all",newType="todo",col=null,canWrite=true,editId=null;
const $=id=>document.getElementById(id);

function renderTabs(){
  const f=[["all","Alle"],["todo","To-Dos","todo"],["thema","Themen","thema"],["abs","Absprachen","abs"]];
  $("tabs").innerHTML="";
  f.forEach(([k,l,c])=>{const b=document.createElement("button");b.className="tab"+(c?" col":"")+(filter===k?" on":"");if(c)b.style.setProperty("--c","var(--"+c+")");b.textContent=l;b.onclick=()=>{filter=k;renderTabs();render()};$("tabs").appendChild(b)});
}
function renderTypes(){
  $("types").innerHTML="";
  Object.entries(TYPES).forEach(([k,l])=>{const b=document.createElement("button");b.className="tab col"+(newType===k?" on":"");b.style.setProperty("--c","var(--"+k+")");b.textContent=l;b.onclick=()=>{newType=k;renderTypes()};$("types").appendChild(b)});
}
function fmt(ts){try{return new Date(ts).toLocaleDateString("de-CH",{day:"numeric",month:"short"})}catch(e){return""}}
let pendingFocus=null,needRender=false;
const timers={};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const isEditing=()=>{const a=document.activeElement;return !!(a&&a.matches&&a.matches(".stin,.nm"))};
function autosize(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function autoAll(){document.querySelectorAll(".stin").forEach(autosize)}
function later(k,fn){clearTimeout((timers[k]||{}).t);timers[k]={fn,t:setTimeout(()=>{delete timers[k];fn()},700)}}
function flush(k){const x=timers[k];if(x){clearTimeout(x.t);delete timers[k];x.fn()}}
function render(){
  if(dragging)return;
  if(isEditing()&&!pendingFocus){needRender=true;return}
  needRender=false;
  const ws=items.filter(i=>(i.subs||[]).length);
  const ab=$("allbtn");ab.style.display=ws.length?"":"none";
  ab.textContent=ws.length&&ws.every(i=>open.has(i.id))?"Alle einklappen":"Alle ausklappen";
  const a=document.activeElement,key=a&&a.dataset&&a.dataset.key,pos=a&&a.selectionStart;
  renderCore();
  const fk=pendingFocus?pendingFocus.key:key,fp=pendingFocus?pendingFocus.pos:pos;
  pendingFocus=null;
  if(fk){const el=document.querySelector('[data-key="'+fk+'"]');if(el){el.focus();if(fp!=null)try{el.setSelectionRange(fp,fp)}catch(e){}}}
  autoAll();
}
document.addEventListener("pointerdown",e=>{if(isEditing()&&!e.target.closest(".stin,.nm"))document.activeElement.blur()},true);
document.addEventListener("focusout",()=>setTimeout(()=>{if(needRender&&!isEditing())render()},0));
function startDrag(e,el){
  e.preventDefault();
  const g=e.currentTarget,list=$("list");
  const grab=e.clientY-el.getBoundingClientRect().top;
  dragging=true;g.setPointerCapture(e.pointerId);el.classList.add("drag");
  const mid=n=>{const r=n.getBoundingClientRect();return r.top+r.height/2};
  let y=e.clientY;
  const place=()=>{
    el.style.transform="";
    const prev=el.previousElementSibling,next=el.nextElementSibling;
    if(prev&&prev.dataset.id&&y<mid(prev))list.insertBefore(el,prev);
    else if(next&&next.dataset.id&&y>mid(next))list.insertBefore(next,el);
    el.style.transform="translateY("+(y-grab-el.getBoundingClientRect().top)+"px)";
  };
  const mv=ev=>{y=ev.clientY;place();if(y<80)window.scrollBy(0,-8);else if(y>innerHeight-80)window.scrollBy(0,8)};
  const end=()=>{
    g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",end);g.removeEventListener("pointercancel",end);
    el.style.transform="";el.classList.remove("drag");dragging=false;
    const get=n=>n&&n.dataset&&n.dataset.id?items.find(x=>x.id===n.dataset.id):null;
    let pe=el.previousElementSibling;while(pe&&get(pe)&&isDone(get(pe)))pe=pe.previousElementSibling;
    const p=get(pe),me=get(el);let n=get(el.nextElementSibling);if(n&&isDone(n))n=null;
    let ord=null;
    if(p&&n)ord=(ordOf(p)+ordOf(n))/2;else if(p)ord=ordOf(p)+1;else if(n)ord=ordOf(n)-1;
    if(ord!==null&&me){me.ord=ord;col.doc(me.id).update({ord}).catch(()=>{})}
    items.sort(cmp);
    render();
  };
  g.addEventListener("pointermove",mv);g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function saveSubs(ref,fn){
  const id=typeof ref==="string"?ref:ref.id;
  const cur=items.find(x=>x.id===id);if(!cur||!col)return;
  const next=fn(cur.subs||[]);cur.subs=next;
  col.doc(id).update({subs:next}).catch(()=>{$("note").innerHTML='<div class="note">Speichern nicht möglich.</div>'});
}
function decorateSub(row,ta,i,s){
  row.classList.toggle("done",!!(s.done&&i.type==="todo"));
  if(i.type==="todo"){
    const c=document.createElement("button");c.className="schk";c.textContent=s.done?"✓":"";c.disabled=!canWrite;
    c.onclick=()=>saveSubs(i.id,l=>l.map(x=>x.id===s.id?{...x,done:!x.done}:x));
    row.insertBefore(c,ta);
  }
  if(s.who){const w=document.createElement("span");w.className="sw";w.textContent=s.who+":";row.insertBefore(w,ta)}
  const k="sub-"+i.id+"-"+s.id;
  ta.dataset.key=k;ta.placeholder="";ta.readOnly=!canWrite;
  ta.oninput=()=>{
    drafts[k]=ta.value;autosize(ta);
    later(k,()=>{
      const t=ta.value.trim();if(!t)return;
      saveSubs(i.id,l=>l.map(x=>x.id===s.id?{...x,text:t}:x));
      if(drafts[k]===ta.value)delete drafts[k];
    });
  };
  ta.onblur=()=>{flush(k);if(!ta.value.trim()){delete drafts[k];saveSubs(i.id,l=>l.filter(x=>x.id!==s.id))}};
  ta.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ta.blur()}};
  if(canWrite){
    const d=document.createElement("button");d.className="sdel";d.textContent="×";d.setAttribute("aria-label","Unterpunkt löschen");
    d.onclick=()=>{delete drafts[k];saveSubs(i.id,l=>l.filter(x=>x.id!==s.id));render()};
    row.appendChild(d);
  }
}
function makeSubRow(i,s){
  const row=document.createElement("div");row.className="sub-row";
  const ta=document.createElement("textarea");ta.className="stin";ta.rows=1;
  const k="sub-"+i.id+"-"+s.id;
  ta.value=drafts[k]!==undefined?drafts[k]:s.text;
  row.appendChild(ta);decorateSub(row,ta,i,s);
  return row;
}
function adopt(ta,itemId){
  const nk="new-"+itemId,text=ta.value.trim();
  const it=items.find(x=>x.id===itemId);
  if(!text||!it)return;
  const sub={id:newId(),text,who:myName,done:false,ts:Date.now()};
  delete drafts[nk];
  saveSubs(itemId,l=>[...l,sub]);
  if(document.activeElement===ta&&ta.isConnected){
    const row=ta.parentNode;
    row.classList.remove("newrow");
    decorateSub(row,ta,it,sub);
    row.after(makeNewRow(it));
    autoAll();
  }else render();
}
function makeNewRow(i){
  const nk="new-"+i.id;
  const row=document.createElement("div");row.className="sub-row newrow";
  const ta=document.createElement("textarea");ta.className="stin";ta.rows=1;
  ta.placeholder="Neuer Unterpunkt…";ta.dataset.key=nk;ta.value=drafts[nk]||"";
  ta.oninput=()=>{drafts[nk]=ta.value;autosize(ta);later(nk,()=>adopt(ta,i.id))};
  ta.onblur=()=>flush(nk);
  ta.onkeydown=e=>{
    if(e.key!=="Enter")return;
    e.preventDefault();
    const text=ta.value.trim();if(!text)return;
    const x=timers[nk];if(x){clearTimeout(x.t);delete timers[nk]}
    const it=items.find(z=>z.id===i.id)||i;
    const sub={id:newId(),text,who:myName,done:false,ts:Date.now()};
    delete drafts[nk];
    saveSubs(i.id,l=>[...l,sub]);
    row.before(makeSubRow(it,sub));
    ta.value="";autoAll();
  };
  row.appendChild(ta);
  return row;
}
function subBox(i){
  const w=document.createElement("div");w.className="subs";
  (i.subs||[]).forEach(s=>w.appendChild(makeSubRow(i,s)));
  if(canWrite){
    w.appendChild(makeNewRow(i));
    const nm=document.createElement("input");nm.className="nm";nm.dataset.key="nm-"+i.id;nm.placeholder="Dein Name (optional)";nm.maxLength=30;nm.value=myName;
    nm.oninput=()=>{myName=nm.value.trim();try{localStorage.setItem("tb_name",myName)}catch(e){}};
    w.appendChild(nm);
  }else{
    const f=document.createElement("button");f.className="fold";f.textContent="▴ einklappen";f.onclick=()=>{open.delete(i.id);render()};w.appendChild(f);
  }
  return w;
}
function renderCore(){
  const list=$("list");list.innerHTML="";
  const v=items.filter(i=>filter==="all"||i.type===filter);
  if(!v.length){list.innerHTML='<div class="empty">Noch nichts hier.<br>Mit + einen Eintrag anlegen.</div>';return}
  v.forEach(i=>{
    const el=document.createElement("div");el.className="item"+(isDone(i)?" done":"");
    const c=document.createElement("button");c.className="chk";c.textContent=i.done?"✓":"";c.disabled=!canWrite;c.onclick=()=>col.doc(i.id).update({done:!i.done,doneAt:!i.done?Date.now():0}).catch(()=>{});
    const isT=i.type==="todo";
    const b=document.createElement("div");b.className="body";
    const t=document.createElement("div");t.className="t";t.textContent=i.text;if(canWrite){t.style.cursor="pointer";t.onclick=()=>startEdit(i)}
    const m=document.createElement("div");m.className="meta";
    const bd=document.createElement("span");bd.className="badge b-"+i.type;bd.textContent=TYPES[i.type]||i.type;m.appendChild(bd);
    if(i.who){const w=document.createElement("span");w.textContent="👤 "+i.who;m.appendChild(w)}
    const d=document.createElement("span");d.textContent=fmt(i.ts);m.appendChild(d);
    b.append(t,m);
    const n=(i.subs||[]).length,isOpen=open.has(i.id);
    if(canWrite){
      const sb=document.createElement("button");sb.className="subtoggle"+(isOpen?" on":"");sb.textContent="+";sb.setAttribute("aria-label","Unterpunkt ergänzen");
      sb.onclick=()=>{if(isOpen)open.delete(i.id);else{open.add(i.id);pendingFocus={key:"new-"+i.id,pos:0}}render()};
      m.appendChild(sb);
    }
    if(isOpen)b.appendChild(subBox(i,true));
    else if(n){
      const last=i.subs[n-1];
      const pk=document.createElement("button");pk.className="peek";
      pk.textContent="▸ "+(last.who?last.who+": ":"")+last.text+(n>1?"  (+"+(n-1)+")":"");
      pk.onclick=()=>{open.add(i.id);render()};
      b.appendChild(pk);
    }
    const x=document.createElement("button");x.className="del";x.textContent="×";x.setAttribute("aria-label","Löschen");x.disabled=!canWrite;
    let armed=false,tm;
    x.onclick=()=>{
      if(!armed){armed=true;x.textContent="Löschen?";x.classList.add("armed");tm=setTimeout(()=>{armed=false;x.textContent="×";x.classList.remove("armed")},3000);return}
      clearTimeout(tm);col.doc(i.id).delete().catch(()=>{$("note").innerHTML='<div class="note">Löschen nicht möglich.</div>'});
    };
    el.dataset.id=i.id;
    if(canWrite&&!isDone(i)){const g=document.createElement("button");g.className="grip";g.textContent="⠿";g.setAttribute("aria-label","Verschieben");
      g.onpointerdown=e=>startDrag(e,el);el.append(g);if(isT)el.append(c);el.append(b,x)}
    else{if(canWrite){const sp=document.createElement("span");sp.style.cssText="flex:none;width:20px";el.append(sp)}if(isT)el.append(c);el.append(b,x)}
    list.appendChild(el);
  });
}
function openSheet(o){
  $("sheet").classList.toggle("open",o);
  if(o){renderTypes();$("save").textContent=editId?"Speichern":"Hinzufügen";$("save").disabled=!$("txt").value.trim();setTimeout(()=>$("txt").focus(),50)}
  else{editId=null;$("txt").value="";$("who").value="";newType="todo"}
}
function startEdit(i){editId=i.id;newType=i.type;$("txt").value=i.text;$("who").value=i.who||"";openSheet(true)}
$("fab").onclick=()=>openSheet(true);
$("sheet").onclick=e=>{if(e.target===$("sheet"))openSheet(false)};
$("txt").oninput=()=>{$("save").disabled=!$("txt").value.trim()};
$("save").onclick=async()=>{
  const text=$("txt").value.trim();if(!text)return;
  if(!col){$("note").innerHTML='<div class="note">Keine Verbindung zur Datenbank. Seite neu laden oder Team-Code prüfen.</div>';return}
  $("save").disabled=true;
  try{
    const who=$("who").value.trim();
    if(editId)await col.doc(editId).update({text,type:newType,who});
    else await col.add({text,type:newType,who,done:false,ts:Date.now()});
    openSheet(false);
  }
  catch(e){$("note").innerHTML='<div class="note">Speichern nicht möglich: '+(e.code||e.message)+'</div>'}
  $("save").disabled=!$("txt").value.trim();
};
$("allbtn").onclick=()=>{
  const ws=items.filter(i=>(i.subs||[]).length);
  if(ws.some(i=>!open.has(i.id)))ws.forEach(i=>open.add(i.id));else open.clear();
  render();
};
renderTabs();render();

let code="";
try{
  const u=new URL(location.href).searchParams.get("code");
  if(u){localStorage.setItem("tb_code",u);history.replaceState(null,"",location.pathname)}
  code=localStorage.getItem("tb_code")||"";
}catch(e){}

function askCode(msg){
  $("fab").style.display="none";
  $("list").innerHTML="";
  $("note").innerHTML='<div class="note"><div style="margin-bottom:8px">'+(msg||"Team-Code eingeben:")+'</div><input id="codein" placeholder="Team-Code" autocomplete="off" style="margin-bottom:8px"><button class="go" id="codego" style="width:100%">Öffnen</button></div>';
  const go=()=>{const v=$("codein").value.trim();if(v.length<8){$("codein").value="";$("codein").placeholder="Mind. 8 Zeichen";return}
    try{localStorage.setItem("tb_code",v)}catch(e){}code=v;$("note").innerHTML="";start()};
  $("codego").onclick=go;$("codein").onkeydown=e=>{if(e.key==="Enter")go()};
}

async function start(){
  if(firebaseConfig.apiKey.startsWith("HIER")){$("note").innerHTML='<div class="note">Firebase-Zugangswerte fehlen noch (siehe ANLEITUNG).</div>';return}
  if(code.length<8){askCode();return}
  const app=initializeApp(firebaseConfig);
  const db=getFirestore(app);
  const c=collection(db,"boards",code,"items");
  col={
    add:d=>addDoc(c,d),
    doc:id=>({update:d=>updateDoc(doc(c,id),d),delete:()=>deleteDoc(doc(c,id))}),
    onSnapshot:(cb,err)=>onSnapshot(c,s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)
  };
  $("fab").style.display="";
  col.onSnapshot(s=>{
    $("note").innerHTML="";
    items=s.docs.map(d=>({id:d.id,...d.data()})).sort(cmp);
    render();
  },()=>{
    try{localStorage.removeItem("tb_code")}catch(e){}
    askCode("Zugriff nicht möglich. Code falsch oder keine Verbindung. Bitte Code erneut eingeben:");
  });
}
start();
